# Migrate the production APP database (the witus.online site: episodes, library, costs, usage,
# operator tasks) after a merge to main, so nobody pastes a connection string. Post-deploy automation
# rule, CLAUDE.md / shared rules v9.
#
# Runs when a push to main changes an app migration, and on demand (Actions -> "Migrate production
# app database" -> Run workflow). It reads one repository secret, STORAGE_DATABASE_URL_UNPOOLED: the
# Neon DIRECT (unpooled) connection string for the site's database. That is the first variable
# drizzle.config.ts reads. Set it once without copying the value (docs/01-operations.md, "App
# database migrations"):
#   neon connection-string --project-id <site project id> | gh secret set STORAGE_DATABASE_URL_UNPOOLED --repo dapperAuteur/witus-online
# GitHub masks the value in every log line. The job fails closed when the secret is missing.
#
# This is the app DB only (db/migrations, drizzle.config.ts). The identity DB (WitUS Accounts) has
# its own workflow, identity-migrate-production.yml, and its own secret. Never point one at the other.
#
# Timing: Vercel deploys the same push in parallel. Keep app migrations additive (new tables, new
# nullable columns) so the old code keeps working while this runs; pages that read a new table say
# "not in this database yet" until it lands. drizzle-kit migrate applies only journal entries newer
# than the newest created_at in drizzle.__drizzle_migrations, so a second run is a no-op.
name: Migrate production app database

on:
  push:
    branches: [main]
    paths:
      - "db/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require STORAGE_DATABASE_URL_UNPOOLED
        env:
          STORAGE_DATABASE_URL_UNPOOLED: ${{ secrets.STORAGE_DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$STORAGE_DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Set the repository secret STORAGE_DATABASE_URL_UNPOOLED (see docs/01-operations.md, App database migrations)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Migrate
        env:
          STORAGE_DATABASE_URL_UNPOOLED: ${{ secrets.STORAGE_DATABASE_URL_UNPOOLED }}
        run: npx drizzle-kit migrate --config drizzle.config.ts

      - name: Summary
        if: always()
        env:
          STORAGE_DATABASE_URL_UNPOOLED: ${{ secrets.STORAGE_DATABASE_URL_UNPOOLED }}
          PGCONNECT_TIMEOUT: "15"
        run: |
          {
            echo "### Production app migrations"
            echo
            echo "Migration files in the repo:"
            echo
            echo '```'
            ls -1 db/migrations/*.sql
            echo '```'
            echo
            echo "Rows in drizzle.__drizzle_migrations (id, created_at = journal \"when\"):"
            echo
            echo '```'
            psql "$STORAGE_DATABASE_URL_UNPOOLED" -X -A -t \
              -c "select id || ' ' || created_at from drizzle.__drizzle_migrations order by id" \
              2>&1 || echo "(could not read the history table)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
