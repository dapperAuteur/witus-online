name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # This repo has no `lint` script in package.json. Enable this step once
      # one is added.
      # - name: Lint
      #   run: npm run lint

      # This repo has no `test` script in package.json. Enable this step once
      # one is added.
      # - name: Test
      #   run: npm test

      - name: Build
        run: npm run build
